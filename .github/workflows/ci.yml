name: demangler CI
on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghc_range: [ "", ":old", ":recent", ":ancient" ]
    steps:
      - uses: actions/checkout@v3
      - uses: cachix/install-nix-action@v20
        with:
          nix_path: nixpkgs=channel:nixos-25.05
      - uses: cachix/cachix-action@v12
        with:
          name: galois
          authToken: '${{ secrets.CACHIX_WHAT4 }}'
      - name: build ${{ matrix.ghc-version }}
        shell: bash
        # n.b. cannot build all versions at once: exceeds github runner disk space
        run: nix run github:galoisinc/eng dev nixbuild${{ matrix.ghc_range }}
